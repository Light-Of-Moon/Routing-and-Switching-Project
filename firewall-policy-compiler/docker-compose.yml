version: '3.8'

services:
  dashboard_app:
    build:
      context: .
      network: host
    container_name: compiler_dashboard
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    depends_on:
      - firewall

  firewall:
    image: wbitt/network-multitool
    container_name: firewall
    privileged: true
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    command: /bin/sh -c "apk add --no-cache iptables && sleep infinity"
    networks:
      internal_net:
        ipv4_address: 10.0.0.254
      dmz_net:
        ipv4_address: 192.168.50.254
      vpn_net:
        ipv4_address: 10.8.0.254
      external_net:
        ipv4_address: 172.20.0.254
    tty: true

  internal_host:
    image: wbitt/network-multitool
    container_name: zone_internal
    restart: always
    networks:
      internal_net:
        ipv4_address: 10.0.5.10
    cap_add:
      - NET_ADMIN
    hostname: internal-pc
    command: /bin/sh -c "ip route del default || true; ip route add default via 10.0.0.254; sleep infinity"

  dmz_host:
    image: wbitt/network-multitool
    container_name: zone_dmz
    restart: always
    networks:
      dmz_net:
        ipv4_address: 192.168.50.10
    environment:
      - HTTP_PORT=80
    cap_add:
      - NET_ADMIN
    hostname: dmz-server
    command: /bin/sh -c "ip route del default || true; ip route add default via 192.168.50.254; nginx; sleep infinity"

  vpn_host:
    image: wbitt/network-multitool
    container_name: zone_vpn
    restart: always
    networks:
      vpn_net:
        ipv4_address: 10.8.0.10
    cap_add:
      - NET_ADMIN
    hostname: vpn-client
    command: /bin/sh -c "ip route del default || true; ip route add default via 10.8.0.254; sleep infinity"

  external_host:
    image: wbitt/network-multitool
    container_name: zone_external
    restart: always
    networks:
      external_net:
        ipv4_address: 172.20.0.50
    cap_add:
      - NET_ADMIN
    hostname: external-attacker
    command: /bin/sh -c "ip route del default || true; ip route add default via 172.20.0.254; sleep infinity"

networks:
  internal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/16
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.50.0/24
  vpn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.8.0.0/24
  external_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
