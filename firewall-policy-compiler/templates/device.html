<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Rules Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <style>
        .rules-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-code);
            font-size: 13px;
            margin-top: 20px;
        }
        .rules-table th {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid var(--panel-border);
            color: var(--text-muted);
            font-family: var(--font-main);
            font-weight: 500;
        }
        .rules-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #e2e8f0;
            word-break: break-all;
        }
        .rules-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
        }
        .badge.accept { background: rgba(16, 185, 129, 0.2); color: var(--accent-success); }
        .badge.drop { background: rgba(239, 68, 68, 0.2); color: var(--accent-danger); }
        .badge.log { background: rgba(245, 158, 11, 0.2); color: var(--accent-warning); }
        
        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-main);
            font-size: 12px;
            transition: all 0.2s;
        }
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
        }
        
        .edit-btn {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-primary);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-main);
            font-size: 12px;
            transition: all 0.2s;
            margin-right: 5px;
        }
        .edit-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            font-family: var(--font-main);
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="logo">
                <div class="shield-icon">💻</div>
                <h1>Device Rules Dashboard</h1>
                <a href="/" style="color: var(--accent-primary); margin-left: 15px; font-size: 14px; text-decoration: none;">&larr; Back to Compiler</a>
            </div>
            <div class="actions">
                <button id="btn-refresh" class="btn secondary">Refresh Rules</button>
            </div>
        </header>

        <main class="dashboard-grid" style="grid-template-columns: 1fr;">
            <section class="panel glass-panel" style="overflow-y: auto;">
                <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                    <div style="display: flex; gap: 20px; align-items: center;">
                        <button class="tab-btn active" onclick="switchTab('viewer')">Visual Rule Viewer</button>
                        <button class="tab-btn" onclick="switchTab('raw')">Raw Output (-v)</button>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="raw-command" class="b-input" placeholder="Custom Add (e.g. -A INPUT -p tcp --dport 22 -j DROP)" style="width: 350px;">
                        <button id="btn-execute-raw" class="btn primary">Add Rule</button>
                    </div>
                </div>

                <!-- Visual Table View -->
                <div id="view-viewer" style="padding: 20px;">
                    <div style="margin-bottom: 20px;" id="policies-container">
                        <!-- Chain policies injected here -->
                    </div>
                    
                    <div style="overflow-x: auto;">
                        <table class="rules-table">
                            <thead>
                                <tr>
                                    <th>Chain</th>
                                    <th>Num</th>
                                    <th>Rule Specification</th>
                                    <th>Action</th>
                                    <th style="width: 130px;">Controls</th>
                                </tr>
                            </thead>
                            <tbody id="rules-tbody">
                                <tr><td colspan="4" style="text-align:center; padding: 30px; color: var(--text-muted);">Loading rules...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Raw View -->
                <div id="view-raw" style="padding: 20px; display: none;">
                    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">
                        Raw iptables output including packet counters (-v) and interfaces.
                    </p>
                    <pre id="rules-output" class="code-block active" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; white-space: pre; overflow-x: auto;">Loading rules...</pre>
                </div>
            </section>
        </main>
        
        <div id="toast" class="toast">Notification</div>
    </div>

    <script src="{{ url_for('static', filename='js/device.js') }}"></script>
    <script>
        function switchTab(tabId) {
            document.getElementById('view-viewer').style.display = tabId === 'viewer' ? 'block' : 'none';
            document.getElementById('view-raw').style.display = tabId === 'raw' ? 'block' : 'none';
            
            const btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tabId === 'viewer');
            btns[1].classList.toggle('active', tabId === 'raw');
        }
    </script>
</body>
</html>
